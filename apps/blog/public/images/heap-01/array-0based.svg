<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">0-based array mapping</title>
  <desc id="desc">Array indices 0 through 5 map directly to tree nodes.</desc>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1}.edge{stroke:#64748b;stroke-width:4}.node{fill:#ccfbf1;stroke:#0f766e;stroke-width:3}.value{fill:#0f172a;font:700 24px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.index{fill:#0f766e;font:700 16px system-ui,sans-serif;text-anchor:middle}.title{fill:#0f172a;font:700 32px system-ui,sans-serif}.subtitle{fill:#475569;font:500 20px system-ui,sans-serif}.cell{fill:#f0fdfa;stroke:#2dd4bf;stroke-width:2}.formula{fill:#0f766e;font:700 18px ui-monospace,monospace}
    @media(prefers-color-scheme:dark){.bg{fill:#0f172a}.panel{fill:#172033;stroke:#475569}.edge{stroke:#94a3b8}.node{fill:#134e4a;stroke:#5eead4}.value,.title{fill:#f8fafc}.index{fill:#99f6e4}.subtitle{fill:#cbd5e1}.cell{fill:#134e4a;stroke:#2dd4bf}.formula{fill:#99f6e4}}
  </style>
  <rect class="bg" width="1200" height="600" rx="28"/><rect class="panel" x="36" y="36" width="1128" height="528" rx="24" stroke-width="2"/>
  <text class="title" x="76" y="91">0-based indexing</text><text class="subtitle" x="1080" y="89" text-anchor="end">root index = 0</text>
  <g class="edge"><line x1="600" y1="158" x2="440" y2="255"/><line x1="600" y1="158" x2="760" y2="255"/><line x1="440" y1="255" x2="350" y2="345"/><line x1="440" y1="255" x2="510" y2="345"/><line x1="760" y1="255" x2="690" y2="345"/></g>
  <g>
    <circle class="node" cx="600" cy="150" r="39"/><text class="value" x="600" y="150">1</text><text class="index" x="600" y="105">i=0</text>
    <circle class="node" cx="440" cy="260" r="39"/><text class="value" x="440" y="260">2</text><text class="index" x="440" y="215">i=1</text>
    <circle class="node" cx="760" cy="260" r="39"/><text class="value" x="760" y="260">3</text><text class="index" x="760" y="215">i=2</text>
    <circle class="node" cx="350" cy="350" r="39"/><text class="value" x="350" y="350">4</text><text class="index" x="350" y="305">i=3</text>
    <circle class="node" cx="510" cy="350" r="39"/><text class="value" x="510" y="350">5</text><text class="index" x="510" y="305">i=4</text>
    <circle class="node" cx="690" cy="350" r="39"/><text class="value" x="690" y="350">6</text><text class="index" x="690" y="305">i=5</text>
  </g>
  <g transform="translate(224 418)">
    <rect class="cell" x="0" y="0" width="125" height="72" rx="8 0 0 8"/><rect class="cell" x="125" y="0" width="125" height="72"/><rect class="cell" x="250" y="0" width="125" height="72"/><rect class="cell" x="375" y="0" width="125" height="72"/><rect class="cell" x="500" y="0" width="125" height="72"/><rect class="cell" x="625" y="0" width="125" height="72" rx="0 8 8 0"/>
    <text class="value" x="62.5" y="36">1</text><text class="value" x="187.5" y="36">2</text><text class="value" x="312.5" y="36">3</text><text class="value" x="437.5" y="36">4</text><text class="value" x="562.5" y="36">5</text><text class="value" x="687.5" y="36">6</text>
    <text class="index" x="62.5" y="98">0</text><text class="index" x="187.5" y="98">1</text><text class="index" x="312.5" y="98">2</text><text class="index" x="437.5" y="98">3</text><text class="index" x="562.5" y="98">4</text><text class="index" x="687.5" y="98">5</text>
  </g>
  <text class="formula" x="76" y="550">parent = (i - 1) / 2  |  left = 2i + 1  |  right = 2i + 2</text>
</svg>
