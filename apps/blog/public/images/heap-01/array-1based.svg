<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">1-based array mapping</title>
  <desc id="desc">Array indices 1 through 6 map to tree nodes; index 0 is unused.</desc>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1}.edge{stroke:#64748b;stroke-width:4}.node{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.value{fill:#0f172a;font:700 24px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.index{fill:#2563eb;font:700 16px system-ui,sans-serif;text-anchor:middle}.title{fill:#0f172a;font:700 32px system-ui,sans-serif}.subtitle{fill:#475569;font:500 20px system-ui,sans-serif}.cell{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.unused{fill:#e2e8f0;stroke:#94a3b8}.unused-text{fill:#64748b;font:700 22px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.formula{fill:#1e40af;font:700 18px ui-monospace,monospace}
    @media(prefers-color-scheme:dark){.bg{fill:#0f172a}.panel{fill:#172033;stroke:#475569}.edge{stroke:#94a3b8}.node{fill:#1e3a5f;stroke:#60a5fa}.value,.title{fill:#f8fafc}.index{fill:#93c5fd}.subtitle{fill:#cbd5e1}.cell{fill:#1e3a5f;stroke:#60a5fa}.unused{fill:#334155;stroke:#64748b}.unused-text{fill:#94a3b8}.formula{fill:#93c5fd}}
  </style>
  <rect class="bg" width="1200" height="600" rx="28"/><rect class="panel" x="36" y="36" width="1128" height="528" rx="24" stroke-width="2"/>
  <text class="title" x="76" y="91">1-based indexing</text><text class="formula" x="1080" y="89" text-anchor="end">parent = i / 2 | left = 2i | right = 2i + 1</text>
  <g class="edge"><line x1="600" y1="158" x2="440" y2="255"/><line x1="600" y1="158" x2="760" y2="255"/><line x1="440" y1="255" x2="350" y2="345"/><line x1="440" y1="255" x2="510" y2="345"/><line x1="760" y1="255" x2="690" y2="345"/></g>
  <g>
    <circle class="node" cx="600" cy="150" r="39"/><text class="value" x="600" y="150">1</text><text class="index" x="600" y="105">i=1</text>
    <circle class="node" cx="440" cy="260" r="39"/><text class="value" x="440" y="260">2</text><text class="index" x="440" y="215">i=2</text>
    <circle class="node" cx="760" cy="260" r="39"/><text class="value" x="760" y="260">3</text><text class="index" x="760" y="215">i=3</text>
    <circle class="node" cx="350" cy="350" r="39"/><text class="value" x="350" y="350">4</text><text class="index" x="350" y="305">i=4</text>
    <circle class="node" cx="510" cy="350" r="39"/><text class="value" x="510" y="350">5</text><text class="index" x="510" y="305">i=5</text>
    <circle class="node" cx="690" cy="350" r="39"/><text class="value" x="690" y="350">6</text><text class="index" x="690" y="305">i=6</text>
  </g>
  <g transform="translate(169 418)">
    <rect class="unused" x="0" y="0" width="110" height="72" rx="8"/><text class="unused-text" x="55" y="36">unused</text>
    <rect class="cell" x="110" y="0" width="110" height="72"/><rect class="cell" x="220" y="0" width="110" height="72"/><rect class="cell" x="330" y="0" width="110" height="72"/><rect class="cell" x="440" y="0" width="110" height="72"/><rect class="cell" x="550" y="0" width="110" height="72"/><rect class="cell" x="660" y="0" width="110" height="72" rx="0 8 8 0"/>
    <text class="value" x="165" y="36">1</text><text class="value" x="275" y="36">2</text><text class="value" x="385" y="36">3</text><text class="value" x="495" y="36">4</text><text class="value" x="605" y="36">5</text><text class="value" x="715" y="36">6</text>
    <text class="index" x="55" y="98">0 (unused)</text><text class="index" x="165" y="98">1</text><text class="index" x="275" y="98">2</text><text class="index" x="385" y="98">3</text><text class="index" x="495" y="98">4</text><text class="index" x="605" y="98">5</text><text class="index" x="715" y="98">6</text>
  </g>
</svg>
