<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Complete binary tree comparison</title>
  <desc id="desc">A valid tree fills the last level from the left; an invalid tree leaves earlier positions empty.</desc>
  <style>
    .bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1}.edge{stroke:#64748b;stroke-width:4}.node-ok{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.node-no{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.ghost{fill:none;stroke:#f87171;stroke-width:3;stroke-dasharray:8 8}.value{fill:#0f172a;font:700 25px system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.heading{fill:#0f172a;font:700 30px system-ui,sans-serif}.ok{fill:#15803d;font:700 22px system-ui,sans-serif}.no{fill:#dc2626;font:700 22px system-ui,sans-serif}.note{fill:#475569;font:500 20px system-ui,sans-serif}.arrow{stroke:#dc2626;stroke-width:4;fill:none;marker-end:url(#arrow)}
    @media(prefers-color-scheme:dark){.bg{fill:#0f172a}.card{fill:#172033;stroke:#475569}.edge{stroke:#94a3b8}.node-ok{fill:#1e3a5f;stroke:#60a5fa}.node-no{fill:#5f2929;stroke:#f87171}.value,.heading{fill:#f8fafc}.ok{fill:#4ade80}.no{fill:#f87171}.note{fill:#cbd5e1}.arrow{stroke:#f87171}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ef4444"/></marker></defs>
  <rect class="bg" width="1200" height="600" rx="28"/>
  <rect class="card" x="36" y="36" width="542" height="528" rx="24" stroke-width="2"/>
  <rect class="card" x="622" y="36" width="542" height="528" rx="24" stroke-width="2"/>
  <text class="heading" x="76" y="92">Complete tree</text><text class="ok" x="510" y="92" text-anchor="end">VALID</text>
  <text class="heading" x="662" y="92">General tree</text><text class="no" x="1096" y="92" text-anchor="end">INVALID</text>
  <g class="edge">
    <line x1="307" y1="165" x2="190" y2="290"/><line x1="307" y1="165" x2="424" y2="290"/>
    <line x1="190" y1="290" x2="125" y2="420"/><line x1="190" y1="290" x2="255" y2="420"/>
    <line x1="893" y1="165" x2="776" y2="290"/><line x1="893" y1="165" x2="1010" y2="290"/>
    <line x1="1010" y1="290" x2="945" y2="420"/><line x1="1010" y1="290" x2="1075" y2="420"/>
  </g>
  <g>
    <circle class="node-ok" cx="307" cy="155" r="42"/><text class="value" x="307" y="155">1</text>
    <circle class="node-ok" cx="190" cy="290" r="42"/><text class="value" x="190" y="290">2</text>
    <circle class="node-ok" cx="424" cy="290" r="42"/><text class="value" x="424" y="290">3</text>
    <circle class="node-ok" cx="125" cy="430" r="42"/><text class="value" x="125" y="430">4</text>
    <circle class="node-ok" cx="255" cy="430" r="42"/><text class="value" x="255" y="430">5</text>
    <circle class="node-no" cx="893" cy="155" r="42"/><text class="value" x="893" y="155">1</text>
    <circle class="node-no" cx="776" cy="290" r="42"/><text class="value" x="776" y="290">2</text>
    <circle class="node-no" cx="1010" cy="290" r="42"/><text class="value" x="1010" y="290">3</text>
    <circle class="ghost" cx="711" cy="430" r="42"/><circle class="ghost" cx="841" cy="430" r="42"/>
    <circle class="node-no" cx="945" cy="430" r="42"/><text class="value" x="945" y="430">4</text>
    <circle class="node-no" cx="1075" cy="430" r="42"/><text class="value" x="1075" y="430">5</text>
  </g>
  <path class="arrow" d="M830 510 C790 480 770 460 747 440"/>
  <text class="note" x="663" y="528">Last level fills continuously from the left</text>
  <text class="note" x="76" y="520">Earlier left positions are empty</text>
</svg>
